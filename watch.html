<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Watch Detail — True North Watches</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <style>
    .detail-layout {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0;
      min-height: 80vh;
    }

    .detail-media {
      position: sticky;
      top: var(--nav-h);
      height: calc(100vh - var(--nav-h));
      background: var(--dark);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .detail-media img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .detail-media__placeholder {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      color: var(--border);
    }

    .detail-media__placeholder svg { width: 80px; height: 80px; }
    .detail-media__placeholder span { font-size: 0.65rem; letter-spacing: 0.2em; text-transform: uppercase; color: var(--muted); }

    .detail-content {
      padding: 80px 64px;
      background: var(--charcoal);
      border-left: 1px solid var(--border);
    }

    .detail-nav {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 40px;
    }

    .detail-nav a, .detail-nav span {
      font-size: 0.65rem;
      font-weight: 600;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .detail-nav a:hover { color: var(--gold); }
    .detail-nav .sep { color: var(--border); }
    .detail-nav .current { color: var(--silver); }

    .detail-brand {
      font-size: 0.65rem;
      font-weight: 700;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--gold);
      margin-bottom: 12px;
    }

    .detail-title {
      font-family: var(--font-serif);
      font-size: clamp(2rem, 3vw, 2.8rem);
      font-weight: 300;
      color: var(--white);
      line-height: 1.2;
      margin-bottom: 8px;
    }

    .detail-ref {
      font-size: 0.8rem;
      color: var(--muted);
      margin-bottom: 32px;
      font-family: var(--font-sans);
    }

    .detail-price-block {
      background: var(--dark);
      border: 1px solid var(--border);
      padding: 28px 32px;
      margin-bottom: 32px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }

    .detail-price-label {
      font-size: 0.62rem;
      font-weight: 600;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 6px;
    }

    .detail-price {
      font-family: var(--font-serif);
      font-size: 2.5rem;
      font-weight: 300;
      color: var(--white);
      line-height: 1;
    }

    .detail-condition-dot {
      display: inline-block;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--gold);
      margin-right: 8px;
    }

    .detail-actions {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 40px;
    }

    .detail-actions .btn {
      justify-content: center;
      padding: 16px;
    }

    .detail-specs {
      border-top: 1px solid var(--border);
      padding-top: 32px;
      margin-bottom: 32px;
    }

    .detail-specs-title {
      font-size: 0.62rem;
      font-weight: 700;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--white);
      margin-bottom: 20px;
    }

    .detail-spec-row {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      padding: 12px 0;
      border-bottom: 1px solid var(--border);
    }

    .detail-spec-key {
      font-size: 0.7rem;
      color: var(--muted);
      font-weight: 500;
    }

    .detail-spec-val {
      font-size: 0.82rem;
      color: var(--silver);
      text-align: right;
      max-width: 60%;
    }

    .detail-includes {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 32px;
    }

    .detail-include-tag {
      font-size: 0.6rem;
      font-weight: 600;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--gold);
      background: var(--gold-faint);
      border: 1px solid rgba(201,168,76,0.25);
      padding: 6px 14px;
    }

    .detail-description {
      font-size: 0.85rem;
      color: var(--silver);
      line-height: 2;
      border-top: 1px solid var(--border);
      padding-top: 28px;
      margin-bottom: 32px;
    }

    .detail-trust {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1px;
      background: var(--border);
      border: 1px solid var(--border);
      margin-bottom: 32px;
    }

    .detail-trust-item {
      background: var(--dark);
      padding: 16px 20px;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .detail-trust-item svg { width: 18px; height: 18px; stroke: var(--gold); flex-shrink: 0; }
    .detail-trust-item span { font-size: 0.7rem; color: var(--silver); line-height: 1.5; }

    .related-section {
      padding: 80px 0;
      border-top: 1px solid var(--border);
    }

    @media (max-width: 900px) {
      .detail-layout { grid-template-columns: 1fr; }
      .detail-media { position: static; height: 60vw; max-height: 480px; }
      .detail-content { padding: 48px 24px; border-left: none; border-top: 1px solid var(--border); }
    }

    @media (max-width: 600px) {
      .detail-trust { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

  <!-- NAV -->
  <nav class="nav scrolled" id="nav">
    <div class="nav__inner">
      <a href="index.html" class="nav__logo">
        <div class="nav__logo-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="9"/><line x1="12" y1="6" x2="12" y2="12.5"/>
            <line x1="12" y1="12.5" x2="15.5" y2="14.5"/><line x1="12" y1="12" x2="8.5" y2="10"/>
          </svg>
        </div>
        <div class="nav__logo-text">
          <span class="nav__logo-name">True North</span>
          <span class="nav__logo-tagline">Watches</span>
        </div>
      </a>
      <div class="nav__links">
        <a href="index.html" class="nav__link">Home</a>
        <a href="watches.html" class="nav__link">Collection</a>
        <a href="sold.html" class="nav__link">Archive</a>
        <a href="index.html#brands" class="nav__link">Brands</a>
        <a href="index.html#about" class="nav__link">About</a>
      </div>
      <div class="nav__actions">
        <a href="watches.html" class="nav__cta">View Collection</a>
        <button class="nav__hamburger" id="hamburger" aria-label="Menu">
          <span></span><span></span><span></span>
        </button>
      </div>
    </div>
  </nav>

  <div class="nav__mobile" id="mobile-menu">
    <a href="index.html" class="nav__mobile-link">Home</a>
    <a href="watches.html" class="nav__mobile-link">Collection</a>
    <a href="sold.html" class="nav__mobile-link">Archive</a>
    <a href="index.html#contact" class="nav__mobile-link">Contact</a>
  </div>

  <!-- DETAIL LAYOUT — populated by JS -->
  <div id="detail-root">
    <div style="display:flex;align-items:center;justify-content:center;min-height:100vh;color:var(--muted);">
      <span class="t-label">Loading…</span>
    </div>
  </div>

  <!-- RELATED -->
  <section class="related-section" id="related-section" style="display:none;">
    <div class="container">
      <div class="section__header">
        <div class="section__header-left">
          <div class="section__eyebrow"><span class="gold-line"></span><span class="t-label gold">Keep Exploring</span></div>
          <h2 class="section__title">You May Also Like</h2>
        </div>
        <a href="watches.html" class="btn btn-outline">View All</a>
      </div>
      <div class="watch-grid watch-grid--tight" id="related-grid"></div>
    </div>
  </section>

  <!-- INQUIRY MODAL -->
  <div class="modal-overlay" id="inquiry-modal">
    <div class="modal">
      <button class="modal__close" onclick="closeInquiry()" aria-label="Close">&times;</button>
      <div class="modal__eyebrow"><span class="gold-line"></span><span class="t-label gold">Inquire</span></div>
      <h2 class="modal__title">Inquire About This Watch</h2>
      <p class="modal__watch-name" id="modal-watch-name"></p>
      <form id="inquiry-form" novalidate>
        <input type="hidden" name="watch" id="modal-watch-field">
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;">
          <div class="form-group">
            <label class="form-label">Name</label>
            <input class="form-input" type="text" name="name" placeholder="John Smith" required>
          </div>
          <div class="form-group">
            <label class="form-label">Phone</label>
            <input class="form-input" type="tel" name="phone" placeholder="+1 (613) 000-0000">
          </div>
        </div>
        <div class="form-group">
          <label class="form-label">Email</label>
          <input class="form-input" type="email" name="email" placeholder="john@example.com" required>
        </div>
        <div class="form-group">
          <label class="form-label">Message</label>
          <textarea class="form-textarea" name="message" placeholder="I'm interested in this watch and would like to know more…"></textarea>
        </div>
        <button type="submit" class="btn btn-primary" style="width:100%;justify-content:center;padding:16px;">Send Inquiry</button>
        <p style="font-size:0.72rem;color:var(--muted);text-align:center;margin-top:16px;">Or call directly: <a href="tel:3432043547" style="color:var(--gold);">343-204-3547</a></p>
      </form>
    </div>
  </div>

  <script src="js/inventory.js"></script>
  <script src="js/main.js"></script>
  <script>
    // Get watch from URL
    const params = new URLSearchParams(window.location.search);
    const watchId = params.get("id");
    const watch = watchId ? getWatchById(watchId) : null;
    const root = document.getElementById("detail-root");

    if (!watch) {
      root.innerHTML = `
        <div style="display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:60vh;gap:24px;text-align:center;padding:48px;">
          <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="var(--border)" stroke-width="1"><circle cx="12" cy="12" r="9"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
          <h1 style="font-family:var(--font-serif);font-size:2rem;color:var(--white);">Watch Not Found</h1>
          <p style="font-size:0.85rem;color:var(--muted);">This watch may have been sold or the link is incorrect.</p>
          <a href="watches.html" class="btn btn-gold-outline">Browse Collection</a>
        </div>`;
    } else {
      // Set page title
      document.title = `${watch.brand} ${watch.model} — True North Watches`;

      const soldTag = watch.status === "sold"
        ? `<div style="background:var(--mid);border:1px solid var(--border);padding:12px 20px;text-align:center;margin-bottom:24px;">
            <span class="t-label" style="color:var(--muted);">This watch has been sold</span>
           </div>`
        : "";

      const includesHtml = (watch.includes || [])
        .map(i => `<span class="detail-include-tag">${i}</span>`)
        .join("");

      const mediaHtml = watch.image
        ? `<img src="${watch.image}" alt="${watch.brand} ${watch.model}">`
        : `<div class="detail-media__placeholder">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="0.75">
              <circle cx="12" cy="12" r="9"/><line x1="12" y1="6" x2="12" y2="12.5"/>
              <line x1="12" y1="12.5" x2="15.5" y2="14.5"/>
            </svg>
            <span>Photography Coming Soon</span>
           </div>`;

      root.innerHTML = `
        <div style="padding-top:var(--nav-h);">
          <div class="detail-layout">
            <!-- Media -->
            <div class="detail-media">${mediaHtml}</div>

            <!-- Content -->
            <div class="detail-content">
              <div class="detail-nav">
                <a href="index.html">Home</a>
                <span class="sep">/</span>
                <a href="watches.html">Collection</a>
                <span class="sep">/</span>
                <span class="current">${watch.brand} ${watch.model}</span>
              </div>

              ${soldTag}

              <div class="detail-brand">${watch.brand}</div>
              <h1 class="detail-title">${watch.model}</h1>
              <div class="detail-ref">Reference ${watch.reference} &middot; ${watch.diameter}</div>

              <!-- Price block -->
              <div class="detail-price-block">
                <div>
                  <div class="detail-price-label">Asking Price</div>
                  <div class="detail-price">${watch.price > 0 ? formatPrice(watch.price) : 'Price on Request'}</div>
                </div>
                <div style="text-align:right;">
                  <div style="font-size:0.6rem;font-weight:700;letter-spacing:0.14em;text-transform:uppercase;color:var(--muted);margin-bottom:4px;">Condition</div>
                  <div style="font-size:0.88rem;color:var(--white);">
                    <span class="detail-condition-dot"></span>${watch.condition}
                  </div>
                </div>
              </div>

              <!-- Actions -->
              ${watch.status !== "sold" ? `
              <div class="detail-actions">
                <button class="btn btn-primary" onclick="openInquiry('${watch.id}')">
                  Inquire About This Watch
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:16px;height:16px;">
                    <path d="M22 2L11 13M22 2L15 22 11 13 2 9l20-7z"/>
                  </svg>
                </button>
                <a href="tel:3432043547" class="btn btn-outline">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:16px;height:16px;">
                    <path d="M22 16.92v3a2 2 0 01-2.18 2 19.79 19.79 0 01-8.63-3.07A19.5 19.5 0 013.07 8.8a19.79 19.79 0 01-3.07-8.64A2 2 0 012 0h3a2 2 0 012 1.72c.127.96.361 1.903.7 2.81a2 2 0 01-.45 2.11L6.09 7.91a16 16 0 006 6l1.27-1.27a2 2 0 012.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0122 14.92v2z"/>
                  </svg>
                  343-204-3547
                </a>
              </div>` : `
              <div class="detail-actions">
                <a href="watches.html" class="btn btn-gold-outline" style="justify-content:center;">Browse Available Watches</a>
                <button class="btn btn-outline" onclick="openInquiry('general')">Request a Similar Piece</button>
              </div>`}

              <!-- Description -->
              <div class="detail-description">${watch.description}</div>

              <!-- Includes -->
              ${includesHtml ? `
              <div style="margin-bottom:28px;">
                <div style="font-size:0.62rem;font-weight:700;letter-spacing:0.2em;text-transform:uppercase;color:var(--white);margin-bottom:14px;">Includes</div>
                <div class="detail-includes">${includesHtml}</div>
              </div>` : ""}

              <!-- Specs -->
              <div class="detail-specs">
                <div class="detail-specs-title">Specifications</div>
                ${[
                  ["Brand",       watch.brand],
                  ["Model",       watch.model],
                  ["Reference",   watch.reference],
                  ["Year",        watch.year],
                  ["Movement",    watch.movement],
                  ["Case",        watch.caseMaterial],
                  ["Bracelet",    watch.bracelet],
                  ["Diameter",    watch.diameter],
                  ["Condition",   watch.condition],
                ].map(([k, v]) => `
                  <div class="detail-spec-row">
                    <span class="detail-spec-key">${k}</span>
                    <span class="detail-spec-val">${v}</span>
                  </div>`).join("")}
              </div>

              <!-- Trust signals -->
              <div class="detail-trust">
                <div class="detail-trust-item">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                    <path d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"/>
                  </svg>
                  <span>100% Authenticated</span>
                </div>
                <div class="detail-trust-item">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                    <path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2V9z"/>
                  </svg>
                  <span>Free Ottawa Delivery</span>
                </div>
                <div class="detail-trust-item">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                    <path d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4"/>
                  </svg>
                  <span>Travel Case Included</span>
                </div>
                <div class="detail-trust-item">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                    <path d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"/>
                  </svg>
                  <span>Unedited Photography</span>
                </div>
              </div>
            </div>
          </div>
        </div>`;

      // Show related watches
      const related = AVAILABLE_WATCHES
        .filter(w => w.id !== watch.id)
        .sort(() => Math.random() - 0.5)
        .slice(0, 3);

      if (related.length) {
        document.getElementById("related-section").style.display = "block";
        renderWatchGrid("related-grid", related, { compact: true });
      }
    }
  </script>
</body>
</html>
